# Shared defaults for all JVM services (ordering-api, kitchen-service, runner-service).
# Precedence when resolving each key: System.getenv (non-blank) > this file.
# See docker-compose.yml for container overrides (e.g. RABBITMQ_HOST on the Compose network).

restaurant {
  database {
    url = "jdbc:h2:mem:restaurant;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"
    driver = "org.h2.Driver"
    user = null
    password = null
  }
  rabbitMq {
    host = "localhost"
    port = 5672
    username = "guest"
    password = "guest"
    exchangeName = "restaurant.orders"
    virtualHost = "/"
  }
  server {
    port = 8080
  }
}
